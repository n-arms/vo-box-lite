[package]
name = "vo-box-lite"
version = "0.1.0"
authors = ["n-arms <75282394+n-arms@users.noreply.github.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "vo-box-lite"
path = "./src/bin/main.rs"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[lib]
name = "vo_box_lite"
path = "./src/lib.rs"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

# Optimize our crate in the dev profile (deps keep their cached debug artifacts).
# opt-level="z" + debug assertions outlined hot-loop code into per-iteration
# calls, which made the EE SIMD blur perf-neutral.
[profile.dev.package.vo-box-lite]
opt-level = 3
debug-assertions = false

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Direct dep for GPIO/delay in the blink smoke test (main.rs); same version esp-idf-svc pulls in.
esp-idf-hal = "0.46.2"
# Direct dep needed for the raw esp-camera bindings (esp_idf_sys::camera) + EspError.
# Same version esp-idf-hal already pulls in; features unify.
esp-idf-sys = "0.37.2"
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
esp_nn_sys = { version = "0.2.1", features = ["esp32s3"] }

[build-dependencies]
embuild = "0.33"

# Compile the esp32-camera C component (espressif/esp32-camera from the ESP-IDF
# component registry, pulled by the IDF component manager at build time) and have
# esp-idf-sys bindgen-generate raw bindings from esp32_camera_bindings.h into a
# dedicated `camera` module (esp_idf_sys::camera).
# Docs: https://github.com/esp-rs/esp-idf-sys/blob/master/BUILD-OPTIONS.md#extra-esp-idf-components
[package.metadata."esp-idf-sys"]
extra_components = [
    { remote_component = { name = "espressif/esp32-camera", version = "2.1.7" },
      bindings_header = "esp32_camera_bindings.h",
      bindings_module = "camera" },
    # esp-tflite-micro runs the int8 calc8 (CALC encoder) model (it pulls esp-nn
    # as its optimized kernel backend). components/semantic is a local C shim over
    # the C++ MicroInterpreter API; bindgen exposes it as esp_idf_sys::tflite.
    { component_dirs = ["components/semantic"],
      remote_component = { name = "espressif/esp-tflite-micro", version = "1.4.1" },
      bindings_header = "components/semantic/tflite_shim.h",
      bindings_module = "tflite" },
]
